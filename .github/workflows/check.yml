name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install check tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck jq gnupg ffmpeg
      - name: Run all checks
        run: tests/run-all.sh
